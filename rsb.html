      background: #0b1020;
      color: #fff;

    /* Navigation */
    .navbar {
      position: sticky;
      top: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
      padding: 12px 20px;
      display: flex;
      gap: 20px;
      border-bottom: 1px solid rgba(5, 255, 5, 0.73);
      z-index: 1000;

    .navbar span {
      color: #3aa6ff;

    section {

      margin: auto;
    }

    .panel {
      background: rgba(255,255,255,0.05);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    select {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(0,0,0,0.4);
      color: #fff;
      margin-bottom: 15px;
    }

    .departure {
      background: rgba(255,255,255,0.08);
      padding: 12px;
      border-radius: 8px;
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
    }

    .line {
      font-weight: bold;
      color: #3aa6ff;
    }
  </style>

  <script>
function openPage() {
  const params = new URLSearchParams(window.location.search);
  const page = params.get("page") || "home";

  // Sections umschalten
  document.querySelectorAll(".section").forEach(sec => sec.style.display = "none");
  const activeSection = document.getElementById(page);
  if (activeSection) activeSection.style.display = "block";

  // Navigation aktiv setzen
  document.querySelectorAll(".navbar a").forEach(a => a.classList.remove("active"));
  const activeLink = document.querySelector(`.navbar a[data-tab="${page}"]`);
  if (activeLink) activeLink.classList.add("active");
}

window.addEventListener("load", openPage);
</script>

        .filter(t => t.stop === stop)
        .sort((a, b) => a.time.localeCompare(b.time));

      if (list.length === 0) {
        departuresDiv.innerHTML = "<p>Keine Abfahrten gefunden.</p>";
        return;

        const div = document.createElement("div");
        div.className = "departure";
        div.innerHTML = `
          <span class="line">${t.line}</span>
          <span>${t.direction}</span>
          <span>${t.time}</span>
        `;
        departuresDiv.appendChild(div);
      });
    }

  <script>
// --- DEIN TAB SYSTEM (Beispiel) ---
function openTab(tabName) {
    document.querySelectorAll("section").forEach(sec => sec.style.display = "none");
    document.getElementById(tabName).style.display = "block";

    if (tabName === "timetable") {
        initFahrplan();
    }
}

// --- FAHRPLAN MODUL ---
let fahrplanGeladen = false;
let fahrplaene = {};

async function initFahrplan() {
    if (fahrplanGeladen) return;

    // JSON laden
    const response = await fetch("data/fahrplaene.json");
    fahrplaene = await response.json();

    const select = document.getElementById("stationSelect");

    // Dropdown füllen
    Object.keys(fahrplaene).forEach(station => {
        const opt = document.createElement("option");
        opt.value = station;
        opt.textContent = station;
        select.appendChild(opt);
    });

    select.addEventListener("change", () => {
        renderFahrplan(select.value);
    });

    renderFahrplan(select.value);
    fahrplanGeladen = true;
}

function renderFahrplan(station) {
    const container = document.getElementById("fahrplanContainer");
    const daten = fahrplaene[station];

    let html = `
        <div style="background:#fff200;padding:20px;border:2px solid black;">
            <h2>Abfahrt – ${station}</h2>
            <table style="width:100%;border-collapse:collapse;font-size:18px;">
                <tr>
                    <th style="border-bottom:1px solid black;">Zeit</th>
                    <th style="border-bottom:1px solid black;">Zug</th>
                    <th style="border-bottom:1px solid black;">Ziel</th>
                    <th style="border-bottom:1px solid black;">Gleis</th>
                </tr>
    `;

    daten.forEach(e => {
        html += `
            <tr>
                <td style="border-bottom:1px solid black;">${e.time}</td>
                <td style="border-bottom:1px solid black;">${e.train}</td>
                <td style="border-bottom:1px solid black;">${e.destination}</td>
                <td style="border-bottom:1px solid black;">${e.platform}</td>
            </tr>
        `;
    });

    html += "</table></div>";
    container.innerHTML = html;
}
</script>
